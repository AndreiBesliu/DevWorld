<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; line-height: 1.5; }
li { margin: 0.3rem 0; }
</style>
</head>
<body>
<h1>{{.Title}}</h1>
<ul id="lines">{{range .Lines}}<li>{{.}}</li>{{end}}</ul>
<script>
// The status page reads the same lines again every 30 s, from the holder's
// /spike/v1/status, while it is visible.
async function refresh() {
  if (document.hidden || !location.pathname.startsWith("/status")) return;
  try {
    const r = await fetch("/spike/v1/status", {cache: "no-store"});
    if (!r.ok) return;
    const {lines} = await r.json();
    const ul = document.getElementById("lines");
    ul.replaceChildren(...lines.map((l) => { const li = document.createElement("li"); li.textContent = l; return li; }));
  } catch (e) { /* the holder handed the hub over: keep the last lines */ }
}
setInterval(refresh, 30000);
document.addEventListener("visibilitychange", refresh);
</script>
</body>
</html>
