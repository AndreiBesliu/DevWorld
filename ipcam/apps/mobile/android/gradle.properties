# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2g

# Capacitor 8's own modules (capacitor-android and the generated
# capacitor-cordova-android-plugins) still use the DSL that AGP 9 replaced
# (lintOptions, targetSdkVersion in a library), so the build keeps the old DSL
# until Capacitor moves. The app and the plugins are written for both.
android.newDsl=false
