// Versions shared by the app, the plugins and Capacitor's modules.
ext {
    minSdkVersion = 29
    compileSdkVersion = 36
    targetSdkVersion = 36

    // Direct dependencies of the app and the plugins: the newest stable
    // releases at least 14 days old (plan Global Constraints), dates from
    // developer.android.com/jetpack/androidx/releases. Capacitor's modules
    // read the same values.
    androidxAppCompatVersion = '1.8.0'          // 2026-08-12
    androidxCoordinatorLayoutVersion = '1.3.0'  // 2025-02-26
    coreSplashScreenVersion = '1.2.0'           // 2025-11-05
    junitVersion = '4.13.2'                     // 2021-02-13, the last JUnit 4
    robolectricVersion = '4.17'                 // 2026-09-10

    // Capacitor 8.5.2's own dependencies, transitive for the app: kept at the
    // versions its Android library declares. Gradle resolves each to the
    // highest version requested, so appcompat may raise them.
    androidxActivityVersion = '1.11.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    androidxWebkitVersion = '1.14.0'
    cordovaAndroidVersion = '14.0.1'
}
