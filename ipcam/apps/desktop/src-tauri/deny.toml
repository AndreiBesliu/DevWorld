# cargo-deny (licenses only): the crates in the shipped Windows binary of the
# spike build. The allowlist is the plan's (MIT, BSD-2/3, Apache-2.0, ISC,
# MPL-2.0) plus the permissive licenses of R35 (Unicode-3.0, Zlib, BSL-1.0,
# CC0-1.0, 0BSD, Unlicense). Any other license, copyleft included (GPL, LGPL,
# AGPL, SSPL, EUPL), fails the check.
#
#   cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check licenses

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
allow = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
]
confidence-threshold = 0.93
# The list is the policy; a license that no crate uses today stays on it.
unused-allowed-license = "allow"

# The shell itself is not published (publish = false).
[licenses.private]
ignore = true
