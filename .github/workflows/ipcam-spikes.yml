name: ipcam-spikes

on:
  push:
    paths:
      - 'ipcam/tools/spikes/video/**'
      - 'ipcam/tools/**'
      - 'ipcam/go.work'
      - 'ipcam/go.work.sum'
      # The e2e job builds the spike app and its workspace dependencies (the player).
      - 'ipcam/apps/packages/**'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-*.yaml'
      - 'ipcam/tsconfig.base.json'
      - '.github/workflows/ipcam-spikes.yml'
  pull_request:
    paths:
      - 'ipcam/tools/spikes/video/**'
      - 'ipcam/tools/**'
      - 'ipcam/go.work'
      - 'ipcam/go.work.sum'
      # The e2e job builds the spike app and its workspace dependencies (the player).
      - 'ipcam/apps/packages/**'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-*.yaml'
      - 'ipcam/tsconfig.base.json'
      - '.github/workflows/ipcam-spikes.yml'

permissions:
  contents: read

concurrency:
  group: ipcam-spikes-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go version comes from go.work alone; never switch toolchains silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
      - name: Build
        run: go build ./tools/...
      - name: Lint
        run: go tool golangci-lint run ./tools/spikes/video/...
      - name: Test
        # -count=1: a result restored from the Go build cache would hide a flaky test.
        run: |
          set -o pipefail
          go test -count=1 -race ./tools/spikes/video/... 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Show test failures as annotations
        # Job logs cannot be read from everywhere; check-run annotations can
        # (gh api repos/<owner>/<repo>/check-runs/<job id>/annotations). GitHub keeps 10
        # error annotations per step, so the failure lines go into one annotation.
        if: failure()
        run: |
          grep -E -- '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE|\s+\S+_test\.go:[0-9]+:)' "$RUNNER_TEMP/test.log" \
            | tools/scripts/annotate.sh 'go test' 60
      - name: Vulnerabilities
        # govulncheck needs a directory that holds a go.mod.
        working-directory: ipcam/tools/spikes/video
        run: go tool govulncheck ./...
      - name: Licenses
        run: tools/scripts/check-licenses.sh

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
      - name: Install ffmpeg
        # ffmpeg with libx264 and libx265 only generates the test media in CI. It is
        # never shipped and never part of a release asset (Global Constraints, Licenses).
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Generate media
        run: go run ./tools/spikes/video/cmd/mediagen -out "${RUNNER_TEMP}/spike-video-media"
      - name: Check media against the spec
        # Tests the files that the upload step uploads. A missing ffmpeg fails instead of skipping.
        env:
          MEDIAGEN_DIR: ${{ runner.temp }}/spike-video-media
          MEDIAGEN_REQUIRE_FFMPEG: '1'
        run: go test -count=1 -v -run TestMediagen ./tools/spikes/video/cmd/mediagen/...
      - name: Test the hub on the media
        # The go job has no ffmpeg, so the tests that read the media skip there. Here a
        # missing media file fails instead of skipping (SPIKE_REQUIRE_MEDIA).
        env:
          MEDIAGEN_DIR: ${{ runner.temp }}/spike-video-media
          SPIKE_REQUIRE_MEDIA: '1'
        run: go test -count=1 -race ./tools/spikes/video/source/... ./tools/spikes/video/cmd/spikehub/...
      - name: Upload media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-video-media
          path: ${{ runner.temp }}/spike-video-media
          if-no-files-found: error
          retention-days: 7
          # H.264, H.265 and fMP4 do not compress further.
          compression-level: 0

  e2e:
    # The browser end-to-end tests (plan Task 12, tools/spikes/video/e2e): spikehub
    # with the spike app embedded and 4 simulated cameras on the media of the
    # media job, and the app in Google Chrome (installed on the runner, with
    # H.264) and in Playwright's Firefox with Mozilla's OpenH264 plugin (spec §14.7).
    needs: media
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
      # The pnpm version comes from "packageManager" in ipcam/package.json alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ipcam/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ipcam/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download media
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-video-media
          path: ${{ runner.temp }}/spike-video-media
      - name: Build the hub with the app
        # The app's dist/ goes into cmd/spikehub/web for this build only; it is never committed.
        run: |
          pnpm --filter spike-video-app build
          cp -R tools/spikes/video/app/dist/. tools/spikes/video/cmd/spikehub/web/
          go build -o "${RUNNER_TEMP}/spikehub" ./tools/spikes/video/cmd/spikehub
      - name: Install Firefox
        run: pnpm --filter spike-video-e2e exec playwright install --with-deps firefox
      - name: Install OpenH264 for Firefox
        # Without the plugin Playwright's Firefox offers no H.264 for WebRTC (see
        # install-openh264.sh). Its folder goes to the tests as SPIKE_OPENH264.
        id: openh264
        run: |
          log="${RUNNER_TEMP}/openh264.log"
          if ! folder="$(tools/spikes/video/e2e/install-openh264.sh "${RUNNER_TEMP}/openh264" 2> "${log}")"; then
            cat "${log}" >&2
            tools/scripts/annotate.sh 'OpenH264 install' 40 < "${log}"
            exit 1
          fi
          cat "${log}" >&2
          ls -l "${folder}"
          echo "folder=${folder}" >> "${GITHUB_OUTPUT}"
      - name: End-to-end tests
        env:
          SPIKE_HUB: ${{ runner.temp }}/spikehub
          SPIKE_MEDIA: ${{ runner.temp }}/spike-video-media
          SPIKE_HUB_LOG: ${{ runner.temp }}/spikehub.log
          SPIKE_OPENH264: ${{ steps.openh264.outputs.folder }}
          # THROWAWAY CI diagnostics (Task 12 fix 1).
          MOZ_LOG: timestamp,jsep:4,signaling:4,mtransport:4,DataChannel:4,sctp:4,GMP:4,nr_ice:4
          MOZ_LOG_FILE: ${{ runner.temp }}/moz/firefox.log
          PION_LOG_DEBUG: ice,dtls,sctp,pc,dtlstransport,icetransport,sctptransport
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/moz"
          google-chrome --version
          pnpm --filter spike-video-e2e e2e --project firefox 2>&1 | tee "${RUNNER_TEMP}/e2e.log"
      - name: THROWAWAY diagnostics
        if: success() || failure()
        run: |
          sed -n 's/^e2e-ice: //p' "${RUNNER_TEMP}/e2e.log" | grep -v 'S10: selecte' | cut -c1-600 | tools/scripts/annotate.sh 'ice S9' 150 notice || true
          sed -n 's/^e2e-ice: //p' "${RUNNER_TEMP}/e2e.log" | grep 'S10: selecte' | cut -c1-600 | tools/scripts/annotate.sh 'ice S10' 150 notice || true
          grep -viE 'rtcp|rtp |nack|twcc|interceptor' "${RUNNER_TEMP}/spikehub.log" | grep -iE 'ice|dtls|sctp|candidate|pair|state|error|warn|refused' | cut -c1-400 | head -n 150 | tools/scripts/annotate.sh 'pion log' 150 notice || true
          find "${RUNNER_TEMP}/moz" -type f -printf "%s %p\n" | tools/scripts/annotate.sh 'moz files' 40 notice || true
          cat "${RUNNER_TEMP}"/moz/firefox.log* 2>/dev/null | grep -iE 'ice|dtls|sctp|candidate|gmp|h264|state|error|fail' | grep -viE 'rtcp|rtp ' | cut -c1-400 | head -n 150 | tools/scripts/annotate.sh 'moz log head' 150 notice || true
          cat "${RUNNER_TEMP}"/moz/firefox.log* 2>/dev/null | grep -iE 'ice|dtls|sctp|candidate|gmp|h264|state|error|fail' | grep -viE 'rtcp|rtp ' | cut -c1-400 | tail -n 150 | tools/scripts/annotate.sh 'moz log tail' 150 notice || true
      - name: Show the measurements as a notice
        # Each test prints what it measured on a line that starts with "e2e: ".
        if: success() || failure()
        run: |
          if [[ -f "${RUNNER_TEMP}/e2e.log" ]]; then
            sed -n 's/^e2e: //p' "${RUNNER_TEMP}/e2e.log" | tools/scripts/annotate.sh 'e2e measurements' 40 notice
          fi
      - name: Show failures as annotations
        # Job logs cannot be read from everywhere; check-run annotations can. The
        # failing tests with their assertion messages (which carry the app's
        # window.__spikeErrors and connection panel), the run's summary, and the
        # end of the hub's log.
        if: failure()
        run: |
          log="${RUNNER_TEMP}/e2e.log"
          if [[ -f "${log}" ]] && grep -qE '^  [0-9]+\) \[' "${log}"; then
            sed -n '/^  [0-9]\+) \[/,$p' "${log}" | tools/scripts/annotate.sh 'e2e failures' 150
            sed -n '/^  [0-9]\+ failed$/,$p' "${log}" | tools/scripts/annotate.sh 'e2e summary' 40
          elif [[ -f "${log}" ]]; then
            tail -n 40 "${log}" | tools/scripts/annotate.sh 'e2e log' 40
          fi
          if [[ -f "${RUNNER_TEMP}/spikehub.log" ]]; then
            tail -n 40 "${RUNNER_TEMP}/spikehub.log" | tools/scripts/annotate.sh 'spikehub log' 40
          fi
