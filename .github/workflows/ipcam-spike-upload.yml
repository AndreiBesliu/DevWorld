name: ipcam-spike-upload

# The Phase 0 (c2) upload spike (ipcam/docs/superpowers/plans/2026-10-18-phase0c2-upload-spike.md):
# the spike module tools/spikes/upload and, as the plan's tasks add them, the hub packages
# it measures (TREES). Its lab, MI5's 15-min variant, is ipcam-spike-upload-lab.yml.
# ipcam-spike-recording.yml also tests c2's hub packages, through its ./hub/...: accepted
# double coverage.

on:
  push:
    # Branch pushes only, as in the other ipcam workflows: a tag push ignores path filters.
    branches: ['**']
    paths:
      - 'ipcam/hub/**'
      - 'ipcam/tools/spikes/upload/**'
      # uploadreport imports the video module's redact package.
      - 'ipcam/tools/spikes/video/**'
      # The hub shares requirements with the recorder spike, so in the workspace that
      # module's go.mod can select newer versions of the hub's dependencies, and its go.sum
      # holds their checksums; the upload job also builds its reccontroller and runs its
      # recmediagen (Task 8, P13).
      - 'ipcam/tools/spikes/recording/**'
      # The pinned tools (golangci-lint, govulncheck, go-licenses), the scripts the jobs
      # run, and the license allowlist that the license check reads.
      - 'ipcam/tools/go.mod'
      - 'ipcam/tools/go.sum'
      - 'ipcam/tools/scripts/**'
      - 'ipcam/tools/licenses/**'
      - 'ipcam/go.work'
      - 'ipcam/go.work.sum'
      # The line endings of the checkout on the windows job.
      - 'ipcam/.gitattributes'
      - '.github/workflows/ipcam-spike-upload.yml'
  pull_request:
    paths:
      - 'ipcam/hub/**'
      - 'ipcam/tools/spikes/upload/**'
      # uploadreport imports the video module's redact package.
      - 'ipcam/tools/spikes/video/**'
      # The hub shares requirements with the recorder spike, so in the workspace that
      # module's go.mod can select newer versions of the hub's dependencies, and its go.sum
      # holds their checksums; the upload job also builds its reccontroller and runs its
      # recmediagen (Task 8, P13).
      - 'ipcam/tools/spikes/recording/**'
      # The pinned tools (golangci-lint, govulncheck, go-licenses), the scripts the jobs
      # run, and the license allowlist that the license check reads.
      - 'ipcam/tools/go.mod'
      - 'ipcam/tools/go.sum'
      - 'ipcam/tools/scripts/**'
      - 'ipcam/tools/licenses/**'
      - 'ipcam/go.work'
      - 'ipcam/go.work.sum'
      # The line endings of the checkout on the windows job.
      - 'ipcam/.gitattributes'
      - '.github/workflows/ipcam-spike-upload.yml'

permissions:
  contents: read

concurrency:
  group: ipcam-spike-upload-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go version comes from go.work alone; never switch toolchains silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

# Every step that runs a command writes its output to ${RUNNER_TEMP}/<step id>.log. Job
# logs cannot be read from everywhere, check-run annotations can (gh api
# repos/<owner>/<repo>/check-runs/<job id>/annotations), so the last step of each job
# turns the log of each failed step into one error annotation: the failure and compile
# error lines of a go test, else the end of the log.

jobs:
  media:
    # Task 8: the media of reccontroller --local's simulated cameras for the windows job's
    # MI5 device tests, made with ffmpeg (a CI tool only, never shipped), as c1's
    # ipcam-spike-recording makes its own. The upload job makes its copy itself.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
            ipcam/tools/spikes/recording/go.sum
      - name: Media
        id: media
        run: |
          set -o pipefail
          {
            sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null &&
              go run ./tools/spikes/video/cmd/mediagen -out "${RUNNER_TEMP}/media" &&
              go run ./tools/spikes/recording/cmd/recmediagen -out "${RUNNER_TEMP}/media" &&
              ls -l "${RUNNER_TEMP}/media"
          } 2>&1 | tee "${RUNNER_TEMP}/media.log"
      - name: Upload media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-upload-media
          path: ${{ runner.temp }}/media
          if-no-files-found: error
          retention-days: 7
          # H.264, H.265 and fMP4 do not compress further.
          compression-level: 0
      - name: Show failures as annotations
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          for id in $(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<< "${STEPS}"); do
            log="${RUNNER_TEMP}/${id}.log"
            [[ -f "${log}" ]] || continue
            tail -n 60 "${log}" | tools/scripts/annotate.sh "${id}" 60
          done

  upload:
    runs-on: ubuntu-24.04
    # Task 8: the media's generation and the mi5 process tests' -timeout 30m.
    timeout-minutes: 50
    env:
      # The packages that the jobs build, lint, test and check, one tree per word. Tasks 2,
      # 4, 7b, 9 and 10 each add theirs (P12). ./hub runs hub/spikeonly_test.go, which keeps
      # the spike marker out of the production module. The Lint and Cross steps lint the
      # trees under ./hub with hub/.golangci.yml and the others with the upload spike's.
      # The Test step has the fork as MEDIAMTX_BIN (Task 9: uploadspike's end-to-end tests run
      # the real ipcam-hub, which starts MediaMTX even without jobs), so ipcam-hub's process
      # tests that need only the fork run here too, as c1's ipcam-spike-recording runs them:
      # accepted double coverage. Those that need the media skip here.
      TREES: ./tools/spikes/upload/... ./hub ./hub/internal/storage/... ./hub/internal/outbox/... ./hub/internal/catalog/... ./hub/cmd/ipcam-hub/... ./hub/internal/playback/... ./hub/internal/crypto/...
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/hub/go.sum
            ipcam/hub/third_party/mediamtx/go.sum
            ipcam/tools/spikes/video/go.sum
            ipcam/tools/spikes/recording/go.sum
            ipcam/tools/spikes/upload/go.sum
      - name: Build
        id: build
        run: |
          set -o pipefail
          go build ${TREES} 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - name: Build the MediaMTX fork
        # For the Test step's MEDIAMTX_BIN, as ipcam-spike-recording builds it (Task 9; moved
        # here from v2's Task 7b: TestMI6_TokenNotInResults is the first test of this job
        # that needs it).
        id: fork-build
        working-directory: ipcam/hub/third_party/mediamtx
        env:
          GOWORK: 'off'
        run: |
          set -o pipefail
          {
            go build -o "${RUNNER_TEMP}/bin/mediamtx" . &&
              "${RUNNER_TEMP}/bin/mediamtx" --version
          } 2>&1 | tee "${RUNNER_TEMP}/fork-build.log"
      - name: Media
        # Task 8 (moved here from v2's Task 7b): the mi5 process tests record the simulated
        # cameras through reccontroller --local, whose media mediagen and recmediagen make
        # with ffmpeg (a CI tool only, never shipped).
        id: media
        run: |
          set -o pipefail
          {
            sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null &&
              go run ./tools/spikes/video/cmd/mediagen -out "${RUNNER_TEMP}/media" &&
              go run ./tools/spikes/recording/cmd/recmediagen -out "${RUNNER_TEMP}/media" &&
              ls -l "${RUNNER_TEMP}/media"
          } 2>&1 | tee "${RUNNER_TEMP}/media.log"
      - name: Lint
        # tools/scripts/lint-trees.sh lints each module's trees with that module's config:
        # golangci-lint takes the config of the first path it analyses.
        id: lint
        run: |
          set -o pipefail
          tools/scripts/lint-trees.sh linux 2>&1 | tee "${RUNNER_TEMP}/lint.log"
      - name: Cross
        # c1's release ships ipcam-hub for linux/arm/7 and linux/arm64, and no other push
        # workflow cross-compiles the hub or lints its Windows-only files. lint-trees.sh runs
        # golangci-lint built for the runner (go tool -n) with GOOS=windows: go tool would build
        # it for Windows, which this runner cannot run.
        id: cross
        run: |
          set -o pipefail
          {
            GOOS=linux GOARCH=arm GOARM=7 go build ${TREES} &&
              GOOS=linux GOARCH=arm64 go build ${TREES} &&
              GOOS=windows GOARCH=amd64 go vet ${TREES} &&
              tools/scripts/lint-trees.sh windows
          } 2>&1 | tee "${RUNNER_TEMP}/cross.log"
      - name: Test
        # -count=1: a result restored from the Go build cache would hide a flaky test. The
        # variables make the tests that need the fork, uploadspike's LAN listener test, which
        # binds the real port 7091 on the runner's RFC 1918 addresses, and its reader page
        # test, which runs the page's script in the runner's Node, fail instead of skipping.
        # -timeout 30m (Task 8): the mi5 process tests of one package, each with real mi5
        # starts, can together pass go test's 10-min default per package under -race.
        id: test
        env:
          MEDIAMTX_BIN: ${{ runner.temp }}/bin/mediamtx
          RECSPIKE_REQUIRE_MEDIAMTX: '1'
          MEDIAGEN_DIR: ${{ runner.temp }}/media
          SPIKE_REQUIRE_MEDIA: '1'
          UPLOADSPIKE_REQUIRE_LAN: '1'
          UPLOADSPIKE_REQUIRE_NODE: '1'
        run: |
          set -o pipefail
          go test -count=1 -race -timeout 30m ${TREES} 2>&1 | tee "${RUNNER_TEMP}/test.log"
      - name: Test as root
        # Task 9: hubproc gives the hub's files to ipcam-spike when uploadspike runs as root on
        # the Pi, and never follows a link planted in the hub's data directory. Those tests
        # chown to another uid, so they run as root; the test binary is built as the runner's
        # user, so that root writes nothing into its Go caches.
        id: test-root
        run: |
          set -o pipefail
          {
            go test -c -o "${RUNNER_TEMP}/bin/hubproc.test" ./tools/spikes/upload/hubproc &&
              sudo UPLOADSPIKE_REQUIRE_ROOT=1 "${RUNNER_TEMP}/bin/hubproc.test" -test.count=1 -test.v \
                -test.run '^TestHubproc_(LinuxFilesOwnedBySpikeUser|PlantedLinksNeverFollowed)$' &&
              go test -c -o "${RUNNER_TEMP}/bin/install.test" ./tools/spikes/upload/install &&
              sudo "${RUNNER_TEMP}/bin/install.test" -test.count=1 -test.v -test.run '^TestInstall_LinuxLayout$'
          } 2>&1 | tee "${RUNNER_TEMP}/test-root.log"
      - name: Test times
        # g2-12: each package's -race test time on this runner, as a notice, since the job
        # log cannot be read; c1's ipcam-spike-recording jobs run these tests too. The sed
        # drops any module path's owner and repository, so no handle reaches a notice (C2-R5).
        run: |
          set -o pipefail
          grep -E '^(ok|FAIL)\s' "${RUNNER_TEMP}/test.log" | sed -E 's|github\.com/[^/]+/[^/]+/ipcam/||' |
            tools/scripts/annotate.sh test-times 60 notice
      - name: Video build list
        # R04: the modules that join the workspace must not move a dependency of the video spike.
        id: build-list
        run: |
          set -o pipefail
          tools/scripts/check-video-build-list.sh 2>&1 | tee "${RUNNER_TEMP}/build-list.log"
      - name: Vulnerabilities of the upload spike
        # govulncheck needs a directory that holds a go.mod.
        id: vuln-upload
        working-directory: ipcam/tools/spikes/upload
        run: |
          set -o pipefail
          go tool govulncheck ./... 2>&1 | tee "${RUNNER_TEMP}/vuln-upload.log"
      - name: Vulnerabilities of the hub
        id: vuln-hub
        working-directory: ipcam/hub
        run: |
          set -o pipefail
          go tool govulncheck ./... 2>&1 | tee "${RUNNER_TEMP}/vuln-hub.log"
      - name: Licenses
        id: licenses
        run: |
          set -o pipefail
          tools/scripts/check-licenses.sh ${TREES} 2>&1 | tee "${RUNNER_TEMP}/licenses.log"
      - name: Show failures as annotations
        # A test's indented file:line lines include the testing package's own, such as a
        # temporary folder's failed removal, which names no _test.go file.
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          for id in $(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<< "${STEPS}"); do
            log="${RUNNER_TEMP}/${id}.log"
            [[ -f "${log}" ]] || continue
            if grep -qE -- '^(--- FAIL|FAIL)' "${log}"; then
              grep -E -- '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE|# |\S+\.go:[0-9]+:|\s+\S+\.go:[0-9]+:)' "${log}" |
                tools/scripts/annotate.sh "${id}" 60
            else
              # go-licenses warns about every package with assembly; those lines hide its verdict.
              grep -vE '^(W[0-9]{4} |/)' "${log}" | tail -n 60 | tools/scripts/annotate.sh "${id}" 60
            fi
          done

  windows:
    # On windows-latest: the same trees' tests and build (the markers test reads a CRLF
    # checkout here), without -race, which needs a C compiler there; the upload job runs
    # the tests with it. Then the S4U smoke (P49): ci/s4u-run.ps1 runs whoami.exe in a
    # temporary Task Scheduler task with an S4U logon, the logon of uploadspike's
    # autostart, the sealer's round trip in it: sealed in a normal step, unsealed in the S4U
    # task, and hubproc's clean stop of a hub without a console (Task 9).
    # Task 8: then MI5's device tests of an mi5 that ends badly, on the real ipcam-hub.exe
    # with a Windows build of the fork and the media job's media.
    needs: media
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      TREES: ./tools/spikes/upload/... ./hub ./hub/internal/storage/... ./hub/internal/outbox/... ./hub/internal/catalog/... ./hub/cmd/ipcam-hub/... ./hub/internal/playback/... ./hub/internal/crypto/...
    defaults:
      run:
        working-directory: ipcam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/hub/go.sum
            ipcam/hub/third_party/mediamtx/go.sum
            ipcam/tools/spikes/video/go.sum
            ipcam/tools/spikes/recording/go.sum
            ipcam/tools/spikes/upload/go.sum
      - name: Test
        id: test
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m ${TREES} 2>&1 | tee "${RUNNER_TEMP}/test.log"
      - name: Build
        # ipcam-hub.exe at the path that Task 8's WanBlock smoke step reads.
        id: build
        run: |
          set -o pipefail
          {
            go build ${TREES} &&
              go build -o "$RUNNER_TEMP/bin/ipcam-hub.exe" ./hub/cmd/ipcam-hub
          } 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - name: WanBlock smoke
        # Task 8 (P15, P56): MI5's Windows Firewall block of ipcam-hub.exe alone, on this
        # runner only (never on a PC of ours): www.googleapis.com reads blocked from the
        # hub over IPv4 and IPv6 (or no-address), loopback and the runner's private address
        # answer, and after the unblock the provider answers again. The profiles are enabled
        # for the job if a runner image has them off.
        id: wanblock
        run: |
          set -o pipefail
          {
            pwsh -NoProfile -Command 'Get-NetFirewallProfile | Format-Table Name, Enabled;
              if (Get-NetFirewallProfile | Where-Object { -not $_.Enabled }) { Set-NetFirewallProfile -All -Enabled True }' &&
              UPLOADSPIKE_REQUIRE_WINFW=1 UPLOADSPIKE_HUB_BIN="${RUNNER_TEMP}/bin/ipcam-hub.exe" \
                go test -count=1 -v -run '^TestWanBlock_WindowsSmoke$' ./tools/spikes/upload/mi5/
          } 2>&1 | tee "${RUNNER_TEMP}/wanblock.log"
      - name: S4U smoke
        # The script must exit 0, and whoami must name the runner's user. Then two cheap
        # checks of its exit code: the program's own (cmd.exe /c exit 7 gives 7), and 124
        # when the program outlives -TimeoutSec (ping for about 29 s, with -TimeoutSec 2).
        id: s4u
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/s4u.log"
          out="${RUNNER_TEMP}/s4u.txt"
          status=0
          pwsh -File tools/spikes/upload/ci/s4u-run.ps1 -Exe "$WINDIR/System32/whoami.exe" -Out "$RUNNER_TEMP/s4u.txt" 2>&1 |
            tee "${log}" || status=$?
          echo "s4u-run.ps1 exited ${status}; whoami in the S4U task printed: $(cat "${out}" 2> /dev/null)" | tee -a "${log}"
          if [[ ${status} -ne 0 ]] || ! { [[ -n ${USERNAME} ]] && grep -qiF -- "${USERNAME}" "${out}"; }; then
            echo "S4U smoke: want exit 0, a USERNAME, and that user '${USERNAME}' in the output" | tee -a "${log}"
            exit 1
          fi
          # MSYS_NO_PATHCONV: Git Bash may rewrite an argument that starts with /c as a drive
          # path (C:/).
          status=0
          MSYS_NO_PATHCONV=1 pwsh -File tools/spikes/upload/ci/s4u-run.ps1 -Exe "$WINDIR/System32/cmd.exe" \
            -Arguments '/c exit 7' -Out "$RUNNER_TEMP/s4u-exit7.txt" 2>&1 | tee -a "${log}" || status=$?
          echo "cmd.exe /c exit 7 in the S4U task: s4u-run.ps1 exited ${status}, want 7" | tee -a "${log}"
          [[ ${status} -eq 7 ]] || exit 1
          # The target goes first, so the -Arguments value does not start with '-', which
          # pwsh -File may take for a parameter name.
          status=0
          pwsh -File tools/spikes/upload/ci/s4u-run.ps1 -Exe "$WINDIR/System32/PING.EXE" -Arguments '127.0.0.1 -n 30' \
            -TimeoutSec 2 -Out "$RUNNER_TEMP/s4u-timeout.txt" 2>&1 | tee -a "${log}" || status=$?
          echo "ping -n 30 127.0.0.1 with -TimeoutSec 2 in the S4U task: s4u-run.ps1 exited ${status}, want 124" |
            tee -a "${log}"
          [[ ${status} -eq 124 ]] || exit 1
      - name: S4U seal round trip
        # P49, P19: the machine-scope DPAPI sealer seals in this normal step and unseals inside
        # an S4U task, the logon of uploadspike's autostart. The -Arguments value starts with
        # '-', which pwsh -File would take for a parameter name, so it is bound with the colon
        # form, -Arguments:<value>, as one argument.
        id: s4u-seal
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/s4u-seal.log"
          exe="${RUNNER_TEMP}/bin/crypto.test.exe"
          blob="${RUNNER_TEMP}/sealed.bin"
          out="${RUNNER_TEMP}/s4u-unseal.txt"
          {
            go test -c -o "${exe}" ./hub/internal/crypto &&
              "${exe}" -test.run '^TestSealer_SealToFile$' -test.v -sealer-blob "${blob}"
          } 2>&1 | tee "${log}"
          status=0
          pwsh -File tools/spikes/upload/ci/s4u-run.ps1 -Exe "${exe}" \
            "-Arguments:-test.run ^TestSealer_UnsealFromFile\$ -test.v -sealer-blob ${blob}" -Out "${out}" 2>&1 |
            tee -a "${log}" || status=$?
          echo "s4u-run.ps1 exited ${status}; the S4U task printed:" | tee -a "${log}"
          cat "${out}" 2> /dev/null | tee -a "${log}"
          if [[ ${status} -ne 0 ]] || ! grep -qF -- '--- PASS: TestSealer_UnsealFromFile' "${out}"; then
            echo "S4U seal round trip: want exit 0 and '--- PASS: TestSealer_UnsealFromFile' in the S4U output" | tee -a "${log}"
            exit 1
          fi
      - name: S4U hub stop
        # Task 9: hubproc.Stop ends the stand-in hub through its stdin's end, never through a
        # kill, inside an S4U task, which gives the test no console: the autostart's case.
        id: s4u-hubproc
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/s4u-hubproc.log"
          exe="${RUNNER_TEMP}/bin/hubproc.test.exe"
          out="${RUNNER_TEMP}/s4u-hubproc.txt"
          go test -c -o "${exe}" ./tools/spikes/upload/hubproc 2>&1 | tee "${log}"
          status=0
          pwsh -File tools/spikes/upload/ci/s4u-run.ps1 -Exe "${exe}" \
            "-Arguments:-test.run ^TestHubproc_StopIsCleanWithoutConsole\$ -test.count=1 -test.v" -Out "${out}" 2>&1 |
            tee -a "${log}" || status=$?
          echo "s4u-run.ps1 exited ${status}; the S4U task printed:" | tee -a "${log}"
          cat "${out}" 2> /dev/null | tee -a "${log}"
          if [[ ${status} -ne 0 ]] || ! grep -qF -- '--- PASS: TestHubproc_StopIsCleanWithoutConsole' "${out}"; then
            echo "S4U hub stop: want exit 0 and '--- PASS: TestHubproc_StopIsCleanWithoutConsole' in the S4U output" |
              tee -a "${log}"
            exit 1
          fi
      - name: Download media
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-upload-media
          path: ${{ runner.temp }}/media
      - name: Build the MediaMTX fork
        id: fork-build
        working-directory: ipcam/hub/third_party/mediamtx
        env:
          GOWORK: 'off'
        run: |
          set -o pipefail
          {
            go build -o "${RUNNER_TEMP}/bin/mediamtx.exe" . &&
              "${RUNNER_TEMP}/bin/mediamtx.exe" --version
          } 2>&1 | tee "${RUNNER_TEMP}/fork-build.log"
      - name: MI5 device tests
        # Task 8 (Holding the hub): an mi5 cut by TerminateProcess during its block, and a
        # run after a cut run, on the real hub with MI6's hub under resume; the firewall seam
        # records the block's commands and runs none. The variables make them fail instead
        # of skipping.
        id: mi5-device
        env:
          MEDIAMTX_BIN: ${{ runner.temp }}/bin/mediamtx.exe
          RECSPIKE_REQUIRE_MEDIAMTX: '1'
          MEDIAGEN_DIR: ${{ runner.temp }}/media
          SPIKE_REQUIRE_MEDIA: '1'
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m -v -run '^(TestMI5_HolderEndsAnyWay_OneHubUnderResume|TestMI5_RunAfterCutRun_CountsOnlyItsOwnSegments)$' \
            ./tools/spikes/upload/cmd/uploadspike/ 2>&1 | tee "${RUNNER_TEMP}/mi5-device.log"
      - name: Show failures as annotations
        # A test's indented file:line lines include the testing package's own, such as a
        # temporary folder's failed removal, which names no _test.go file.
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          for id in $(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<< "${STEPS}"); do
            log="${RUNNER_TEMP}/${id}.log"
            [[ -f "${log}" ]] || continue
            if grep -qE -- '^(--- FAIL|FAIL)' "${log}"; then
              grep -E -- '^(--- FAIL|FAIL|panic:|# |\S+\.go:[0-9]+:|\s+\S+\.go:[0-9]+:)' "${log}" |
                tools/scripts/annotate.sh "${id}" 60
            else
              tail -n 60 "${log}" | tools/scripts/annotate.sh "${id}" 60
            fi
          done
