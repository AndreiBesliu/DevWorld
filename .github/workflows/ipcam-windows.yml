name: ipcam-windows

on:
  push:
    paths:
      - 'ipcam/apps/desktop/**'
      - 'ipcam/apps/packages/**'
      - 'ipcam/tools/spikes/video/**'
      - '.github/workflows/ipcam-windows.yml'
  pull_request:
    paths:
      - 'ipcam/apps/desktop/**'
      - 'ipcam/apps/packages/**'
      - 'ipcam/tools/spikes/video/**'
      - '.github/workflows/ipcam-windows.yml'

permissions:
  contents: read

concurrency:
  group: ipcam-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go version comes from go.work alone; never switch toolchains silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  media:
    # The simulated cameras for spikehub on the Windows runner, made here
    # because ffmpeg with libx264 and libx265 comes from Ubuntu's archive.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
      - name: Install ffmpeg
        # ffmpeg with libx264 and libx265 only generates the test media in CI. It is
        # never shipped and never part of a release asset (Global Constraints, Licenses).
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Generate media
        run: go run ./tools/spikes/video/cmd/mediagen -out "${RUNNER_TEMP}/spike-video-media"
      - name: Upload media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-video-media
          path: ${{ runner.temp }}/spike-video-media
          if-no-files-found: error
          retention-days: 1
          # H.264, H.265 and fMP4 do not compress further.
          compression-level: 0

  checks:
    # The Rust of the shell: its line budget (APP-01), the licenses of the
    # crates in the Windows binary (R35), formatting and Clippy. Clippy checks
    # the Windows target from Linux: type-checking needs no Windows SDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ipcam
    env:
      CARGO_DENY_VERSION: 0.20.2
      # sha256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz, as its release publishes it.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native line count (APP-01)
        run: |
          counts="$(tools/scripts/count-native-lines.sh 299 apps/desktop/src-tauri/src 2>&1)" || {
            echo "::error title=APP-01::${counts//$'\n'/%0A}"
            exit 1
          }
          summary="APP-01 Rust of the Windows shell (under 300 lines): ${counts}"
          echo "::notice title=APP-01::${summary}"
          echo "${summary}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Rust toolchain
        # The version and its components come from rust-toolchain.toml alone.
        working-directory: ipcam/apps/desktop/src-tauri
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ipcam/apps/desktop/src-tauri -> target
      - name: Licenses (R35)
        run: |
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" --strip-components=1
          "${RUNNER_TEMP}/cargo-deny" --manifest-path apps/desktop/src-tauri/Cargo.toml --locked check licenses
      - name: Format and Clippy
        working-directory: ipcam/apps/desktop/src-tauri
        # With the spike-metrics feature (the spike build) and without it.
        run: |
          cargo fmt --check
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets --features spike-metrics -- -D warnings
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

  windows:
    # WIN-2: the spike shell on Windows and WebView2, unsigned (code signing is
    # Faza 0-bis): the unit tests, the executable (tauri build --no-bundle) and
    # the NSIS installer. Then S1 by autorun (R5) against spikehub with 4
    # simulated cameras on the runner, from several starts of the app.
    needs: media
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ipcam
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in ipcam/package.json alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ipcam/package.json
      # Node also runs ci/page-state.ts, which reads the page during the smoke test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ipcam/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
      - name: Rust toolchain
        # The version and its components come from rust-toolchain.toml alone.
        working-directory: ipcam/apps/desktop/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ipcam/apps/desktop/src-tauri -> target
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the spike app
        # Tauri embeds its dist/ into the executable (frontendDist).
        run: pnpm --filter spike-video-app build
      - name: Unit tests, executable and installer
        # The tests run in the release profile, so the build reuses their dependencies.
        run: |
          set -o pipefail
          {
            (cd apps/desktop/src-tauri && cargo test --release --locked --features spike-metrics) &&
              pnpm --filter @ipcam/desktop run build:spike &&
              pnpm --filter @ipcam/desktop run bundle:spike
          } 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - name: Show build failures as annotations
        # Job logs cannot be read from everywhere; check-run annotations can
        # (gh api repos/<owner>/<repo>/check-runs/<job id>/annotations).
        if: failure()
        run: |
          log="${RUNNER_TEMP}/build.log"
          [[ -f "${log}" ]] || exit 0
          { grep -E -A12 '^error' "${log}" || true; grep -E -B2 -A10 'panicked|FAILED|failed to bundle' "${log}" || true; } \
            | tr -d '\r' | head -150 | sed -e 's/%/%25/g' \
            | awk 'BEGIN { ORS = "" } { print (NR > 1 ? "%0A" : "::error title=build::") $0 } END { if (NR) print "\n" }'
      - name: Build spikehub
        run: go build -o "${RUNNER_TEMP}/spikehub.exe" ./tools/spikes/video/cmd/spikehub
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spike-video-media
          path: ${{ runner.temp }}/spike-video-media
      - name: S1 by autorun (WIN-2)
        shell: pwsh
        run: >-
          ./apps/desktop/ci/windows-smoke.ps1
          -App apps/desktop/src-tauri/target/release/ipcam-desktop.exe
          -Hub "$env:RUNNER_TEMP/spikehub.exe"
          -Media "$env:RUNNER_TEMP/spike-video-media"
          -Work "$env:RUNNER_TEMP/smoke"
          -Starts 3
      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipcam-desktop-nsis
          path: ipcam/apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
