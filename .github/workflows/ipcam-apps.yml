name: ipcam-apps

on:
  push:
    # Branch pushes only. A spike-video-v* tag starts ipcam-spike-release, whose ci-status
    # gate reads this workflow's runs on the tagged commit; a tag push (which ignores
    # path filters) would start runs of it that are still going when the gate looks.
    branches: ['**']
    paths:
      - 'ipcam/apps/**'
      - 'ipcam/tools/spikes/video/app/**'
      # The spike's Playwright tests are typechecked and linted here, and run in ipcam-spikes.
      - 'ipcam/tools/spikes/video/e2e/**'
      # The spike app's band tests read the shared test vectors.
      - 'ipcam/tools/spikes/video/band/vectors.json'
      # @ipcam/core's agerange tests read the Go golden files and the CCTV vectors there.
      - 'ipcam/hub/internal/crypto/testdata/**'
      # The Android metrics plugin's TypeScript is typechecked and linted here.
      - 'ipcam/tools/spikes/video/android-metrics/**'
      # The native line counter; its test is in ipcam/apps/mobile/test.
      - 'ipcam/tools/scripts/count-native-lines.sh'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-*.yaml'
      - 'ipcam/tsconfig.base.json'
      - 'ipcam/eslint.config.js'
      - 'ipcam/vitest.config.ts'
      - '.github/workflows/ipcam-apps.yml'
  pull_request:
    paths:
      - 'ipcam/apps/**'
      - 'ipcam/tools/spikes/video/app/**'
      # The spike's Playwright tests are typechecked and linted here, and run in ipcam-spikes.
      - 'ipcam/tools/spikes/video/e2e/**'
      # The spike app's band tests read the shared test vectors.
      - 'ipcam/tools/spikes/video/band/vectors.json'
      # @ipcam/core's agerange tests read the Go golden files and the CCTV vectors there.
      - 'ipcam/hub/internal/crypto/testdata/**'
      # The Android metrics plugin's TypeScript is typechecked and linted here.
      - 'ipcam/tools/spikes/video/android-metrics/**'
      # The native line counter; its test is in ipcam/apps/mobile/test.
      - 'ipcam/tools/scripts/count-native-lines.sh'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-*.yaml'
      - 'ipcam/tsconfig.base.json'
      - 'ipcam/eslint.config.js'
      - 'ipcam/vitest.config.ts'
      - '.github/workflows/ipcam-apps.yml'

permissions:
  contents: read

concurrency:
  group: ipcam-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in ipcam/package.json alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ipcam/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ipcam/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      # The root Vitest entry is not used by the steps above, so check here that
      # it still starts: it lists test files without running them.
      - name: Root Vitest projects
        run: pnpm exec vitest list --filesOnly
      - name: Build
        run: pnpm build
