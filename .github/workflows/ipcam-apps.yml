name: ipcam-apps

on:
  push:
    paths:
      - 'ipcam/apps/**'
      - 'ipcam/tools/spikes/video/app/**'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-*.yaml'
      - 'ipcam/tsconfig.base.json'
      - 'ipcam/eslint.config.js'
      - '.github/workflows/ipcam-apps.yml'
  pull_request:
    paths:
      - 'ipcam/apps/**'
      - 'ipcam/tools/spikes/video/app/**'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-*.yaml'
      - 'ipcam/tsconfig.base.json'
      - 'ipcam/eslint.config.js'
      - '.github/workflows/ipcam-apps.yml'

permissions:
  contents: read

concurrency:
  group: ipcam-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in ipcam/package.json alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ipcam/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ipcam/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
