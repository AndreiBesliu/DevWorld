name: ipcam-mobile

on:
  push:
    paths:
      - 'ipcam/apps/mobile/**'
      - 'ipcam/apps/packages/**'
      - 'ipcam/tools/spikes/video/app/**'
      - 'ipcam/tools/spikes/video/android-metrics/**'
      # The MV14 step runs the line counter; failures become annotations.
      - 'ipcam/tools/scripts/count-native-lines.sh'
      - 'ipcam/tools/scripts/annotate.sh'
      # The Capacitor and plugin versions come from the lockfile.
      - 'ipcam/pnpm-lock.yaml'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-workspace.yaml'
      - '.github/workflows/ipcam-mobile.yml'
  pull_request:
    paths:
      - 'ipcam/apps/mobile/**'
      - 'ipcam/apps/packages/**'
      - 'ipcam/tools/spikes/video/app/**'
      - 'ipcam/tools/spikes/video/android-metrics/**'
      # The MV14 step runs the line counter; failures become annotations.
      - 'ipcam/tools/scripts/count-native-lines.sh'
      - 'ipcam/tools/scripts/annotate.sh'
      # The Capacitor and plugin versions come from the lockfile.
      - 'ipcam/pnpm-lock.yaml'
      - 'ipcam/package.json'
      - 'ipcam/pnpm-workspace.yaml'
      - '.github/workflows/ipcam-mobile.yml'

permissions:
  contents: read

concurrency:
  group: ipcam-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go version comes from go.work alone; never switch toolchains silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  android:
    # The spike APK (debug-signed by the build's own debug key, never published,
    # OPN-01), the plugins' unit tests and the native line budget (MV14).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wrapper jar is committed and runs as soon as ./gradlew does: check it
      # against Gradle's published checksums before anything runs Gradle.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The pnpm version comes from "packageManager" in ipcam/package.json alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ipcam/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ipcam/pnpm-lock.yaml
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            ipcam/apps/mobile/android/**/*.gradle
            ipcam/apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Android SDK 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the spike app
        run: pnpm --filter spike-video-app build
      - name: Sync the Android project
        # Copies the app's dist/ into the project and generates the plugin wiring.
        run: pnpm --filter @ipcam/mobile run sync
      - name: Line counter tests
        run: pnpm --filter @ipcam/mobile test
      - name: Build and unit tests
        working-directory: ipcam/apps/mobile/android
        # --continue: one run reports every failing task, not only the first.
        # --warning-mode all: each deprecation comes with the code that causes it.
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --continue --warning-mode all assembleSpikeDebug testSpikeDebugUnitTest 2>&1 | tee "${RUNNER_TEMP}/gradle.log"
      - name: Show Gradle failures as annotations
        # Job logs cannot be read from everywhere; check-run annotations can
        # (gh api repos/<owner>/<repo>/check-runs/<job id>/annotations).
        if: failure()
        run: |
          log="${RUNNER_TEMP}/gradle.log"
          [[ -f "${log}" ]] || exit 0
          { grep -E -A12 '^\* What went wrong:' "${log}" || true; grep -E -A30 '^e: | FAILED$' "${log}" || true; } \
            | tools/scripts/annotate.sh gradle
      - name: Native line count (MV14)
        # MV14 counts the production plugins only: the spike metrics plugin is
        # SPIKE-ONLY, and local-network comes in Phase 4.
        run: |
          counts="$(tools/scripts/count-native-lines.sh 400 apps/mobile/plugins/*/android/src/main 2>&1)" || {
            printf '%s\n' "${counts}" | tools/scripts/annotate.sh MV14
            exit 1
          }
          summary="MV14 Kotlin per plugin (budget 400): ${counts//$'\n'/; }; local-network: not measured in Phase 0 (Phase 4); spike metrics plugin: SPIKE-ONLY, not counted"
          echo "::notice title=MV14::${summary}"
          echo "${summary}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipcam-spike-apk
          path: ipcam/apps/mobile/android/app/build/outputs/apk/spike/debug/app-spike-debug.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    # AND-3: the APK on an API 36 emulator runs S1 by autorun (R5) against
    # spikehub with 4 simulated cameras on the runner, from five cold starts
    # in a row and a sixth that changes the font scale during the run (one start
    # per job could not show a launch that fails now and then).
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ipcam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ipcam/go.work
          cache-dependency-path: |
            ipcam/go.work.sum
            ipcam/tools/go.sum
            ipcam/tools/spikes/video/go.sum
      # Node runs ci/read-page.ts, which reports the page's state on a failure.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install ffmpeg
        # ffmpeg with libx264 and libx265 only generates the test media in CI. It is
        # never shipped and never part of a release asset (Global Constraints, Licenses).
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Generate media
        run: go run ./tools/spikes/video/cmd/mediagen -out "${RUNNER_TEMP}/spike-video-media"
      - name: Start spikehub
        run: |
          go build -o "${RUNNER_TEMP}/spikehub" ./tools/spikes/video/cmd/spikehub
          mkdir -p "${RUNNER_TEMP}/results"
          nohup "${RUNNER_TEMP}/spikehub" -sims 4 -media "${RUNNER_TEMP}/spike-video-media" -results "${RUNNER_TEMP}/results" \
            > "${RUNNER_TEMP}/spikehub.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:7080/spike/v1/cameras && exit 0
            sleep 1
          done
          echo "::error title=spikehub::spikehub did not answer on port 7080 within 30 s"
          tail -n 40 "${RUNNER_TEMP}/spikehub.log"
          exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipcam-spike-apk
          path: ${{ runner.temp }}/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: S1 on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          working-directory: ipcam
          script: apps/mobile/ci/emulator-smoke.sh "${RUNNER_TEMP}/apk/app-spike-debug.apk" "${RUNNER_TEMP}/results" "${RUNNER_TEMP}/spikehub.log" 5
